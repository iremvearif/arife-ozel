.card {

}

button {

  color: white;
}

button:focus-visible {
  outline: 3px solid #8d4260;

}

.primary {
  display: block;
  width: 100%;
  margin-top: 20px;
}

.progress {
  height: 7px;
  background: #f0dce3;
  border-radius: 20px;
  overflow: hidden;
  margin: 18px 0;
}

#progressFill {
  height: 100%;
  width: 0;
  background: #d96f93;
  transition: width .25s;
}

#question {
  font-size: 1.25rem;
  line-height: 1.6;
  text-align: center;
  margin: 24px 0;
}

#answers {
  display: grid;
  gap: 10px;
}

.answer {
  text-align: left;
  color: #633747;
  background: #f5dce5;
  border: 1px solid #e8bbcc;
  line-height: 1.5;
}

.answer:hover:not(:disabled) {
  background: #efc2d2;
}

.answer:disabled {
  cursor: default;
  opacity: 1;
}

.answer.correct {
  background: #d9edda;
  border-color: #82b987;
  color: #244e2b;
}

.answer.wrong {
  background: #f4d7d7;
  border-color: #d99a9a;
  color: #793c3c;
}

#feedback {
  text-align: center;
  line-height: 1.6;
  min-height: 26px;
  margin-top: 14px;
}

#nextButton {
  display: none;
  width: 100%;
  margin-top: 14px;
}

#result {
  display: none;
  text-align: center;
  line-height: 1.8;
}

.bigScore {
  font-size: 2.6rem;
  color: #c85f85;
  margin: 15px 0;
}

.small {
  font-size: .88rem;
  text-align: center;
  opacity: .75;
  margin-top: 20px;

.hidden {

</style>

let questions = [];
let current = 0;
let score = 0;
let locked = false;
const QUESTIONS_PER_GAME = 10;

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("result");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function startQuiz() {
  questions = shuffle(questionBank)
    .slice(0, QUESTIONS_PER_GAME)
    .map(q => {
      const options = q.a.map((text, index) => ({
        text,
        correct: index === q.c
      }));
      const mixed = shuffle(options);
      return {
        q: q.q,
        a: mixed.map(option => option.text),
        c: mixed.findIndex(option => option.correct)
      };
    });

  current = 0;
  score = 0;

  startScreen.classList.add("hidden");
  resultScreen.style.display = "none";
  quizScreen.classList.remove("hidden");

  document.getElementById("score").textContent = score;
  showQuestion();
}

function showQuestion() {
  locked = false;
  const q = questions[current];

  document.getElementById("questionCount").textContent =
    `SORU ${current + 1} / ${questions.length}`;

  document.getElementById("progressFill").style.width =
    `${(current / questions.length) * 100}%`;

  questionEl.textContent = q.q;
  feedbackEl.textContent = "Doğru cevabı seç bakalım! 💗";
  answersEl.innerHTML = "";
  nextButton.style.display = "none";

  q.a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.addEventListener("click", () => chooseAnswer(index));
    answersEl.appendChild(button);
  });
}

function chooseAnswer(selected) {
  if (locked) return;
  locked = true;

  const q = questions[current];
  const buttons = [...answersEl.querySelectorAll("button")];

  buttons.forEach(button => button.disabled = true);

  if (selected === q.c) {
    score++;
    buttons[selected].classList.add("correct");
    buttons[selected].textContent += " ✓";
    feedbackEl.textContent = "Bildin! Aferin sana. 💗";
  } else {
    buttons[selected].classList.add("wrong");
    buttons[selected].textContent += " ✕";
    buttons[q.c].classList.add("correct");
    buttons[q.c].textContent += " ✓";
    feedbackEl.textContent = "Bu sefer olmadı ama şimdi öğrendin. ♡";
  }

  document.getElementById("score").textContent = score;
  document.getElementById("progressFill").style.width =
    `${((current + 1) / questions.length) * 100}%`;

  nextButton.textContent =
    current === questions.length - 1 ? "Sonucu gör 💌" : "Sonraki soru →";

  nextButton.style.display = "block";
}

function nextQuestion() {
  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.classList.add("hidden");
  resultScreen.style.display = "block";

  document.getElementById("finalScore").textContent =
    `${score} / ${questions.length}`;

  let message;

  if (score === 10) {
    message = "İrem'i çok iyi tanıyorsun! 🥹💗";
  } else if (score >= 8) {
    message = "İrem seni görünce gurur duyar! 💕";
  } else if (score >= 6) {
    message = "Çok güzel! Biraz daha anı biriktirin. 🌷";
  } else if (score >= 4) {
    message = "Daha keşfedilecek çok şey var. 💌";
  } else {
    message = "İrem'i daha yakından tanıma zamanı! 💗";
  }

  document.getElementById("resultMessage").textContent = message;
  document.getElementById("resultDetail").textContent =
    "En güzel cevap, onu dinleyerek ve birlikte yeni anılar biriktirerek öğrenilir. ♡";
}

document.getElementById("startButton").addEventListener("click", startQuiz);
nextButton.addEventListener("click", nextQuestion);
document.getElementById("againButton").addEventListener("click", startQuiz);
</script>
