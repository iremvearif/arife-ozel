<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Penalty Shootout ⚽</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07130f;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#topbar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
  background: linear-gradient(#0009, transparent);
}

#back {
  border: 1px solid #ffffff55;
  color: white;
  background: #101b18bb;
  border-radius: 25px;
  padding: 11px 17px;
  font-size: 14px;
}

#score {
  background: #101b18cc;
  border: 1px solid #ffffff33;
  border-radius: 14px;
  padding: 10px 17px;
  text-align: center;
  font-size: 13px;
}

#score strong {
  display: block;
  font-size: 22px;
  margin-top: 3px;
}

#message {
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  font-size: clamp(20px, 4vw, 34px);
  font-weight: 900;
  text-shadow: 0 3px 12px black;
  width: 90%;
  pointer-events: none;
}

#instruction {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  font-size: 13px;
  color: #fff;
  text-shadow: 0 2px 8px black;
  pointer-events: none;
}

#power {
  position: absolute;
  bottom: 65px;
  left: 50%;
  transform: translateX(-50%);
  width: 170px;
  height: 8px;
  background: #ffffff55;
  border-radius: 10px;
  overflow: hidden;
  pointer-events: none;
}

#powerFill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #45e88c, #f5d34d, #ff554c);
}

#buttons {
  position: absolute;
  bottom: 100px;
  right: 18px;
  display: flex;
  gap: 8px;
}

.action {
  background: #14271fdd;
  border: 1px solid #ffffff55;
  color: white;
  padding: 12px 15px;
  border-radius: 12px;
  font-weight: bold;
}

#loading {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #07130f;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 15px;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #ffffff33;
  border-top-color: #56e99a;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#loading small { color: #a9c8b8; }

@media (orientation: portrait) {
  #rotate {
    display: flex;
  }
}

#rotate {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 20;
  background: #07130f;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  font-size: 20px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="topbar">
  <button id="back">← GERİ</button>
  <div id="score">
    PENALTI SERİSİ
    <strong id="scoreText">0 - 0</strong>
  </div>
</div>

<div id="message">PENALTI ZAMANI!</div>

<div id="power">
  <div id="powerFill"></div>
</div>

<div id="instruction">
  TOPA DOKUN VE ŞUT İÇİN SÜRÜKLE ⚽
</div>

<div id="buttons">
  <button class="action" id="restart">↻ Yeniden</button>
  <button class="action" id="fullscreen">⛶</button>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>STADYUM HAZIRLANIYOR</div>
  <small>3D futbolcular yükleniyor...</small>
</div>

<div id="rotate">
  📱
  <br><br>
  Oyunu daha iyi oynamak için telefonunu yatay çevir!
</div>
<script>
window.addEventListener('error', function(e) {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.innerHTML =
      '<div style="color:white;padding:25px;text-align:center;">' +
      '<h2>OYUNDA HATA VAR</h2>' +
      '<p>' + (e.message || 'Bilinmeyen hata') + '</p>' +
      '</div>';
    loading.style.display = 'flex';
  }
});

window.addEventListener('unhandledrejection', function(e) {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.innerHTML =
      '<div style="color:white;padding:25px;text-align:center;">' +
      '<h2>BAĞLANTI HATASI</h2>' +
      '<p>' + e.reason + '</p>' +
      '</div>';
    loading.style.display = 'flex';
  }
});
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const container = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x829ba5);
scene.fog = new THREE.Fog(0x829ba5, 25, 75);

const camera = new THREE.PerspectiveCamera(
  43, window.innerWidth / window.innerHeight, 0.1, 150
);

camera.position.set(7.5, 5.2, 11);
camera.lookAt(0, 1.1, -3);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x263b29, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(-8, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// STADYUM

const grass = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({
    color: 0x267c3c,
    roughness: 0.95
  })
);

grass.rotation.x = -Math.PI / 2;
grass.position.y = -0.03;
grass.receiveShadow = true;
scene.add(grass);

// ÇİM ŞERİTLERİ

for (let i = 0; i < 12; i++) {
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(90, 3.5),
    new THREE.MeshStandardMaterial({
      color: i % 2 ? 0x287d3c : 0x328a43
    })
  );

  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(0, 0.005, -25 + i * 7);
  scene.add(stripe);
}

// SAHA ÇİZGİLERİ

function line(x1, z1, x2, z2, color = 0xffffff) {
  const geometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x1, 0.025, z1),
    new THREE.Vector3(x2, 0.025, z2)
  ]);

  const mesh = new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({ color })
  );

  scene.add(mesh);
}

line(-8, -5, 8, -5);
line(-8, 4, 8, 4);
line(-8, -5, -8, 4);
line(8, -5, 8, 4);

line(-4, -5, -4, -1);
line(4, -5, 4, -1);
line(-4, -1, 4, -1);

// KALE

const goal = new THREE.Group();
scene.add(goal);

const frameMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 0.4,
  roughness: 0.3
});

function bar(x, y, z, sx, sy, sz) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    frameMaterial
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  goal.add(mesh);
}

bar(-3.66, 1.22, -6, 0.13, 2.44, 0.13);
bar(3.66, 1.22, -6, 0.13, 2.44, 0.13);
bar(0, 2.44, -6, 7.4, 0.13, 0.13);

// KALE AĞI

const netMaterial = new THREE.LineBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.48
});

for (let x = -3.6; x <= 3.6; x += 0.4) {
  const points = [
    new THREE.Vector3(x, 0, -6),
    new THREE.Vector3(x, 2.4, -6),
    new THREE.Vector3(x, 2.4, -8)
  ];

  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    netMaterial
  ));
}

for (let y = 0.2; y < 2.4; y += 0.35) {
  const points = [
    new THREE.Vector3(-3.6, y, -6),
    new THREE.Vector3(3.6, y, -6)
  ];

  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    netMaterial
  ));
}

// TRİBÜNLER

const standMaterial = new THREE.MeshStandardMaterial({
  color: 0x263b45,
  roughness: 0.85
});

for (let i = 0; i < 5; i++) {
  const stand = new THREE.Mesh(
    new THREE.BoxGeometry(22, 0.7, 2),
    standMaterial
  );

  stand.position.set(0, 0.8 + i * 0.7, -12 - i * 1.7);
  scene.add(stand);
}

// GERÇEK 3D TARAFTAR MODELİ

const crowdLoader = new GLTFLoader();

crowdLoader.load(
  './penalti%20seyirci.glb',

  function(gltf) {

    const fan = gltf.scene;

    fan.traverse(function(object) {
      if (object.isMesh) {
        object.castShadow = false;
        object.receiveShadow = false;
      }
    });

    // Modelin boyutunu otomatik ayarla
    const bounds = new THREE.Box3().setFromObject(fan);
    const size = bounds.getSize(new THREE.Vector3());

    if (size.y > 0) {
      fan.scale.setScalar(1.5 / size.y);
    }

    // İlk taraftarı tribüne yerleştir
    const newBounds = new THREE.Box3().setFromObject(fan);

   fan.position.set(
  -3,
  2.5 - newBounds.min.y,
  -11.5
);

    scene.add(fan);

    console.log("3D taraftar yüklendi!");
  },

  undefined,

  function(error) {
    console.error("Taraftar modeli yüklenemedi:", error);
  }
);

// SEYİRCİLER SONU
// TRİBÜN IŞIKLARI

for (const x of [-11, 11]) {
  const light = new THREE.PointLight(0xffffff, 180, 35);
  light.position.set(x, 10, -5);
  scene.add(light);
}

// FUTBOL TOPU

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.23, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0xfafafa,
    roughness: 0.65
  })
);

ball.position.set(0, 0.23, 1.4);
ball.castShadow = true;
scene.add(ball);

// TOP DESENLERİ

for (let i = 0; i < 5; i++) {
  const patch = new THREE.Mesh(
    new THREE.CircleGeometry(0.075, 5),
    new THREE.MeshStandardMaterial({ color: 0x171717 })
  );

  patch.position.set(
    Math.cos(i * 1.256) * 0.19,
    0.23 + Math.sin(i * 1.256) * 0.19,
    1.4
  );

  patch.rotation.y = -Math.PI / 2;
  ball.add(patch);
}

// 3D FUTBOLCU MODELLERİ

const playerGroup = new THREE.Group();
scene.add(playerGroup);
playerGroup.position.set(-1.7, 0, 1.4);

const keeperGroup = new THREE.Group();
scene.add(keeperGroup);
keeperGroup.position.set(0, 0, -5.65);

// MODELLER SONRADAN YÜKLENECEK
let player = null;
let keeper = null;
let modelsReady = true;

// Şimdilik yükleme ekranını kaldır.
document.getElementById('loading').style.display = 'none';


// OYUN SİSTEMİ

let goals = 0;
let saves = 0;
let attempts = 0;
let shooting = false;
let dragging = false;
let dragStart = null;
let shot = null;
let goalieTarget = 0;
let resultTimer = 0;

const scoreText = document.getElementById('scoreText');
const message = document.getElementById('message');
const powerFill = document.getElementById('powerFill');

function showMessage(text) {
  message.textContent = text;
}

function updateScore() {
  scoreText.textContent = goals + ' - ' + saves;
}

function resetBall() {
  ball.position.set(0, 0.23, 1.4);
  ball.rotation.set(0, 0, 0);
}

function shoot(dx, dy) {
  if (shooting) return;

  const power = Math.min(1, Math.max(0.25, Math.hypot(dx, dy) / 180));

  const targetX = THREE.MathUtils.clamp(dx / 55, -3.1, 3.1);
  const targetY = THREE.MathUtils.clamp(0.6 + dy / 100, 0.35, 2.25);

  shot = {
    start: ball.position.clone(),
    end: new THREE.Vector3(targetX, targetY, -6),
    progress: 0,
    duration: 0.65 + (1 - power) * 0.35,
    power
  };

  goalieTarget = targetX > 0.6 ? 1 : targetX < -0.6 ? -1 : 0;
  shooting = true;
  attempts++;

  showMessage('ŞUT GELİYOR!');
  document.getElementById('instruction').textContent = 'ŞUT ÇEKİLDİ!';
}

function finishShot() {
  const x = shot.end.x;
  const y = shot.end.y;

  const insideGoal = Math.abs(x) < 3.55 && y < 2.35 && y > 0.15;

  const keeperReach =
    Math.abs(x - goalieTarget * 1.6) < 1.15 &&
    y < 1.9;

  if (insideGoal && keeperReach) {
    saves++;
    showMessage('KALECİ KURTARDI! 🧤');
  } else if (insideGoal) {
    goals++;
    showMessage('GOOOOOOL! ⚽');
  } else {
    saves++;
    showMessage('AUT! TOP DIŞARIDA!');
  }

  updateScore();
  resultTimer = 2;
  shooting = false;
  shot = null;
}

function resetGame() {
  goals = 0;
  saves = 0;
  attempts = 0;
  shooting = false;
  shot = null;
  goalieTarget = 0;
  resetBall();

  keeperGroup.position.set(0, 0, -5.65);
  keeperGroup.rotation.set(0, 0, 0);
  playerGroup.position.set(-1.7, 0, 1.4);

  updateScore();
  showMessage('YENİ PENALTI SERİSİ!');
  document.getElementById('instruction').textContent =
    'TOPA DOKUN VE ŞUT İÇİN SÜRÜKLE ⚽';
}


// DOKUNMATİK KONTROL

const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', e => {
  if (shooting || e.clientY < window.innerHeight * 0.48) return;

  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (!dragging || !dragStart) return;

  const dx = e.clientX - dragStart.x;
  const dy = dragStart.y - e.clientY;

  const power = Math.min(100, Math.hypot(dx, dy) / 2);
  powerFill.style.width = power + '%';
});

canvas.addEventListener('pointerup', e => {
  if (!dragging || !dragStart) return;

  const dx = e.clientX - dragStart.x;
  const dy = dragStart.y - e.clientY;

  dragging = false;
  dragStart = null;
  powerFill.style.width = '0%';

  if (Math.hypot(dx, dy) > 15) {
    shoot(dx, dy);
  }
});

document.getElementById('restart').onclick = resetGame;


// GERİ DÖN

function goBack() {
  location.href = 'index.html';
}

document.getElementById('back').onclick = goBack;

history.pushState({ game: true }, '');

window.addEventListener('popstate', () => {
  location.href = 'index.html';
});

// TAM EKRAN

document.getElementById('fullscreen').onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    console.log('Tam ekran desteklenmiyor');
  }
};

// ANİMASYON

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);

  if (shot) {
    shot.progress += delta / shot.duration;

    const t = Math.min(shot.progress, 1);

    ball.position.x = THREE.MathUtils.lerp(
      shot.start.x, shot.end.x, t
    );

    ball.position.z = THREE.MathUtils.lerp(
      shot.start.z, shot.end.z, t
    );

    ball.position.y =
      shot.start.y * (1 - t) +
      shot.end.y * t +
      Math.sin(t * Math.PI) * 1.3;

    ball.rotation.x += delta * 9;
    ball.rotation.z += delta * 7;

    keeperGroup.position.x = THREE.MathUtils.lerp(
      keeperGroup.position.x,
      goalieTarget * 1.4,
      delta * 4
    );

    keeperGroup.rotation.z = THREE.MathUtils.lerp(
      keeperGroup.rotation.z,
      -goalieTarget * 0.35,
      delta * 4
    );

    if (t >= 1) {
      finishShot();
    }
  }

  if (resultTimer > 0) {
    resultTimer -= delta;

    if (resultTimer <= 0) {
      resetBall();

      keeperGroup.position.set(0, 0, -5.65);
      keeperGroup.rotation.set(0, 0, 0);

      showMessage('SIRADAKİ PENALTI!');
      document.getElementById('instruction').textContent =
        'TOPA DOKUN VE ŞUT İÇİN SÜRÜKLE ⚽';
    }
  }

  renderer.render(scene, camera);
}

animate();

// EKRAN BOYUTU

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
